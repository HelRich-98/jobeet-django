<!-- ================= HERO ================= -->
<section class="bg-base-100 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-20 text-center space-y-8">
    <!-- Title -->
    <h1 class="text-4xl font-bold">Jobeet</h1>

    <!-- Subtitle -->
    <p class="text-base-content/70 max-w-2xl mx-auto">
      Job board pédagogique développé avec Django, inspiré du célèbre tutoriel
      Symfony&nbsp;1.4.
    </p>

    <!-- Search -->
    <form
      action="{% url 'jobs:job_list' %}"
      method="get"
      class="max-w-3xl mx-auto"
    >
      <div class="flex flex-col md:flex-row gap-3">
        <input
          type="search"
          name="q"
          placeholder="Rechercher un emploi, une entreprise, un mot-clé…"
          class="input input-bordered w-full"
        />

        <button type="submit" class="btn btn-primary">Rechercher</button>
      </div>
    </form>
  </div>
</section>
