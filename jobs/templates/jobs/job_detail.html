{% extends 'base.html' %}

<!-- prettier-ignore -->

{% block title %}{{ job.title }}{% endblock %}

{% block content %}
<section class="py-12 space-y-4">
  <div class="mb-4">
    <a href="{{ job.category.get_absolute_url}}">
      <span class="badge badge-primary rounded-full"
        >{{ job.category.name }}</span
      >
    </a>
  </div>

  <div
    class="flex justify-between mb-4 bg-blue-800 text-white px-4 py-2 rounded-2xl"
  >
    <div class="font-bold">{{ job.company.name }}</div>
    <div>{{ job.company.location }}</div>
  </div>

  <div class="px-2 space-y-4">
    <h1 class="text-2xl font-bold">{{ job.title }}</h1>

    <div class="flex justify-between gap-4 mb-4">
      <div class="w-2/3">
        <div>{{ job.description }}</div>
      </div>

      <div class="w-1/3 justify-items-end grid gap-4">
        <div class="">
          <img src="{{ job.company.logo.url }}" alt="{{ job.company.name }}" />
        </div>

        <div class="mt-auto">Poster le {{ job.created_at|date }}</div>
      </div>
    </div>
  </div>

  <a href="{% url 'jobs:job_list' %}">Retour</a>
</section>
{% endblock %}
